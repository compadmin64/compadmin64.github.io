<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 30px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 12px;
    }

    a {
      color: #0000ee;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h1>My Links</h1>

  <ul>
    <li><a href="https://example.com">Example Link 1</a></li>
    <li><a href="https://example.com">Example Link 2</a></li>
    <li><a href="https://example.com">Example Link 3</a></li>
    <li><a href="https://example.com">Example Link 4</a></li>
    <li><a href="https://example.com">Example Link 5</a></li>
  </ul>
</body>
</html>
